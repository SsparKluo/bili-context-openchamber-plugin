<!doctype html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bili context</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 12px;
    font-family: var(--oc-font, system-ui, -apple-system, sans-serif);
    font-size: 13px;
    line-height: 1.45;
    background: var(--oc-bg, #fff);
    color: var(--oc-fg, #1a1a1a);
  }
  .mono { font-family: var(--oc-mono, ui-monospace, monospace); }

  .hdr {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--oc-muted, #999);
    flex: none;
  }
  .dot.ok { background: var(--oc-success, #2ea043); }
  .dot.err { background: var(--oc-error, #d1242f); }
  .hdr-title { font-weight: 600; }
  .hdr-meta {
    margin-left: auto;
    color: var(--oc-muted, #888);
    font-size: 11px;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hdr-meta .stale { color: var(--oc-warning-text, var(--oc-warning, #b5812b)); }

  .card {
    border: 1px solid var(--oc-border, #e2e2e2);
    border-radius: var(--oc-radius, 8px);
    background: var(--oc-elevated, #fafafa);
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .card-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--oc-muted, #888);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sess-title {
    font-weight: 600;
    margin-bottom: 2px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .sess-sub {
    color: var(--oc-muted, #888);
    font-size: 11px;
    margin-bottom: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bar {
    height: 8px;
    border-radius: 4px;
    background: var(--oc-muted-surface, var(--oc-subtle, #eee));
    overflow: hidden;
    margin: 4px 0 4px;
  }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--oc-primary, #3b82f6); transition: width .4s ease; }
  .bar-fill.warn { background: var(--oc-warning, #d99a30); }
  .bar-fill.err { background: var(--oc-error, #d1242f); }
  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--oc-muted, #888);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px;
    margin-top: 10px;
  }
  .stat .v { font-weight: 600; font-size: 14px; }
  .stat .v.good { color: var(--oc-success-text, var(--oc-success, #2ea043)); }
  .stat .v.warn { color: var(--oc-warning-text, var(--oc-warning, #b5812b)); }
  .stat .v.bad { color: var(--oc-error-text, var(--oc-error, #d1242f)); }
  .stat .k {
    font-size: 10px;
    color: var(--oc-muted, #888);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .missbar {
    display: flex;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 10px;
    background: var(--oc-muted-surface, var(--oc-subtle, #eee));
  }
  .missbar > span { height: 100%; }
  .missbar .m-new { background: var(--oc-info, #4493c5); }
  .missbar .m-ttl { background: var(--oc-warning, #d99a30); }
  .missbar .m-comp { background: var(--oc-error, #d1242f); }
  .miss-legend {
    display: flex;
    gap: 12px;
    margin-top: 5px;
    font-size: 10px;
    color: var(--oc-muted, #888);
    flex-wrap: wrap;
  }
  .miss-legend i {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: -1px;
  }

  .notice {
    color: var(--oc-muted, #888);
    font-size: 12px;
  }
  .notice.err { color: var(--oc-error-text, var(--oc-error, #d1242f)); }
  .notice code { font-family: var(--oc-mono, monospace); font-size: 11px; }

  footer {
    color: var(--oc-muted, #888);
    font-size: 10px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  footer .origin { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <header class="hdr">
    <span id="dot" class="dot"></span>
    <span class="hdr-title">bili context</span>
    <span id="hdr-meta" class="hdr-meta mono"></span>
  </header>

  <section id="session" class="card">
    <div class="card-title">当前会话</div>
    <div id="session-body" class="notice">等待数据…</div>
  </section>

  <section id="global" class="card">
    <div class="card-title">全局概览</div>
    <div id="global-body" class="notice">等待数据…</div>
  </section>

  <footer>
    <span id="foot-status"></span>
    <span id="foot-origin" class="origin mono"></span>
  </footer>

  <script src="main.js"></script>
</body>
</html>
